<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: center; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: center; }
    .flow-line { stroke-dasharray: 8, 8; animation: dashMove 35s linear infinite; }
    .pill-anim-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-anim-2 { animation: floatPillReverse 6s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Animated dynamic ambient background circles -->
  <g class="orb-1">
    <circle cx="150" cy="70" r="130" fill="url(#glowGrad)" filter="url(#glow)" />
  </g>
  <g class="orb-2">
    <circle cx="1080" cy="270" r="160" fill="url(#glowGrad)" filter="url(#glow)" />
  </g>

  <!-- Dynamic Animated Logistic Flow Lines (Background Layer) -->
  <g opacity="0.4">
    <path class="flow-line" d="M 0,220 C 300,160 450,280 750,210 C 950,160 1100,240 1200,200" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path class="flow-line" d="M 0,260 C 250,310 500,190 800,270 C 1000,320 1120,250 1200,260" fill="none" stroke="#7f00ff" stroke-width="1.5" />
    <path class="flow-line" d="M 0,110 C 350,170 650,70 950,120 C 1080,140 1150,110 1200,130" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Visual Grid Nodes / Particles -->
  <g fill="#4facfe" opacity="0.3">
    <circle cx="280" cy="210" r="3" />
    <circle cx="560" cy="245" r="3" />
    <circle cx="750" cy="210" r="4" />
    <circle cx="950" cy="180" r="3" />
    <circle cx="1060" cy="235" r="4" />
  </g>

  <!-- Foreground Title and Core Content -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Category Tag -->
    <rect x="-190" y="-70" width="380" height="30" rx="15" fill="#1b263b" stroke="#00f2fe" stroke-width="1.2" opacity="0.9" />
    <text x="0" y="-50" text-anchor="middle" fill="#00f2fe" class="badge-text" letter-spacing="1.5">REVERSE LOGISTICS &amp; RMA ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" class="title-text" font-size="38" letter-spacing="-0.5">
      Direct-to-Consumer Returns Optimization Stacks
    </text>

    <!-- Subtitle -->
    <text x="0" y="42" text-anchor="middle" fill="#94a3b8" class="subtitle-text" font-size="16" letter-spacing="0.2">
      Curated Architecture, SaaS Platforms &amp; Open-Source Reverse Logistics Software
    </text>
  </g>

  <!-- Floating Dynamic Feature Pills in Lower Midground -->
  <g class="pill-anim-1">
    <g transform="translate(180, 240)">
      <rect width="180" height="40" rx="20" fill="#0d1b2a" stroke="#00f2fe" stroke-width="1.5" opacity="0.95" />
      <circle cx="24" cy="20" r="6" fill="#00f2fe" />
      <text x="42" y="25" fill="#f8fafc" class="badge-text">📦 RMA Portals</text>
    </g>
  </g>

  <g class="pill-anim-2">
    <g transform="translate(390, 240)">
      <rect width="210" height="40" rx="20" fill="#0d1b2a" stroke="#4facfe" stroke-width="1.5" opacity="0.95" />
      <circle cx="24" cy="20" r="6" fill="#4facfe" />
      <text x="42" y="25" fill="#f8fafc" class="badge-text">🔄 Instant Exchanges</text>
    </g>
  </g>

  <g class="pill-anim-1">
    <g transform="translate(630, 240)">
      <rect width="200" height="40" rx="20" fill="#0d1b2a" stroke="#7f00ff" stroke-width="1.5" opacity="0.95" />
      <circle cx="24" cy="20" r="6" fill="#7f00ff" />
      <text x="42" y="25" fill="#f8fafc" class="badge-text">🚚 Disposition Routing</text>
    </g>
  </g>

  <g class="pill-anim-2">
    <g transform="translate(860, 240)">
      <rect width="190" height="40" rx="20" fill="#0d1b2a" stroke="#00f2fe" stroke-width="1.5" opacity="0.95" />
      <circle cx="24" cy="20" r="6" fill="#00f2fe" />
      <text x="42" y="25" fill="#f8fafc" class="badge-text">♻️ Circular Economy</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="334" width="1200" height="6" fill="url(#accentGrad)" rx="3" />
</svg>
